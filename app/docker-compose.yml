services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "9099:8080"
    environment:
      - BASE_URL=http://localhost:9099/
      - INSTANCE_NAME=MetaPress SearXNG
      - SEARXNG_SECRET=change_this_to_a_long_random_string
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  ai_research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metacrawler_ai
    restart: unless-stopped
    depends_on:
      - searxng
    env_file:
      - .env
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    ports:
      - "8010:8000"
